name: Kurse

# GitHub-Cron läuft in UTC und kennt keine Sommerzeit.
# Der Laufplan deckt deshalb beide Versätze ab (MEZ = UTC+1, MESZ = UTC+2).
# Werktags alle 5 Minuten, nicht jede Minute: ein Handelstag 1-Minuten-Kurse
# bleibt klein genug, häufigere Commits würden die Historie aufblähen.
# scripts/schedule.mjs lässt den Abruf durch, wenn es in Europe/Berlin
# Mo–Fr zwischen 05:00 und 22:15 ist (auch bei verspätetem Cron),
# solange in New York Vorbörse, Handel oder Nachhandel läuft,
# oder am Wochenende höchstens 45 Minuten nach 09:00, 14:00 oder 20:00.
# Alpaca Marktdaten (IEX) für US-Kurse und Kerzen, wenn die Secrets gesetzt sind.
# Leer heißt: die bisherigen Quellen. Keine Handelsaufträge.
on:
  schedule:
    - cron: "*/5 3-21 * * 1-5"
    - cron: "*/5 22-23 * * 1-5"
    - cron: "*/5 0-1 * * 2-6"
    - cron: "0 7,8,12,13,18,19 * * 0,6"
  workflow_dispatch:

concurrency:
  group: kurse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Stand holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zeitfenster Europe/Berlin
        id: gate
        run: node scripts/schedule.mjs

      - name: Kurse laden
        if: steps.gate.outputs.run == 'true'
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node scripts/fetch-prices.mjs

      - name: Wochentag und Uhrzeit
        if: steps.gate.outputs.run == 'true'
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node scripts/fetch-seasonality.mjs

      - name: Moonshots
        if: steps.gate.outputs.run == 'true'
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node scripts/fetch-moonshots.mjs

      - name: Nur bei Änderung committen
        id: commit
        if: steps.gate.outputs.run == 'true'
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/alerts.json data/meta.json data/seasonality.json data/moonshots.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "Keine Kursänderung."
            exit 0
          fi
          git commit -m "Kurse aktualisiert"
          # GitHub lehnt den Push manchmal kurz ab (commit_refs_rules).
          # Bis zu vier Versuche, dazwischen 5/15/30 s. Bei einem Konflikt in data/
          # bleibt die frisch erzeugte Fassung; sonst werden die Kurse neu geholt.
          export JGTR_REGENERATE="node scripts/fetch-prices.mjs && node scripts/fetch-seasonality.mjs --force && node scripts/fetch-moonshots.mjs"
          if ! node scripts/push-main.mjs; then
            echo "Push nach 4 Versuchen gescheitert."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
