<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Justy GT-R: persönliches Recherche-Cockpit für SpaceX, Tesla und den Musk-Kosmos.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Justy GT-R">
  <title>Justy GT-R</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-750x1334.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/analyse.css">
</head>
<body>
  <a class="skip" href="#pager">Zum Inhalt</a>
  <div class="app">
    <div class="frame">
    <header class="topbar">
      <button id="logo-btn" class="logo-btn" type="button" aria-label="Justy GT-R">
        <img src="icons/logo.svg" width="40" height="40" alt="">
      </button>
      <div class="brand">
        <strong>Justy GT-R <span id="mode-pill" class="pill" hidden>Beispiel</span></strong>
        <span id="stand">Recherche</span>
      </div>
      <button class="icon-btn" type="button" data-action="open-ko" aria-label="Knock-out-Rechner">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="3.2" width="14" height="17.6" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M8 7.2h8M8.2 12h.01M12 12h.01M15.8 12h.01M8.2 16.2h.01M12 16.2h.01M15.8 16.2h.01"/></svg>
      </button>
      <time id="clock"></time>
    </header>
    <div class="pager" id="pager">
      <section class="page" id="page-heute" aria-label="Startseite"><p class="empty">Cockpit wird geladen …</p></section>
      <section class="page" id="page-kalender" aria-label="Kalender"></section>
      <section class="page" id="page-posts" aria-label="Posts"></section>
      <section class="page" id="page-schwarm" aria-label="Schwarmwissen"></section>
      <section class="page" id="page-analyse" aria-label="Chartanalyse"></section>
      <section class="page" id="page-mehr" aria-label="Mehr"></section>
    </div>
    <footer class="dock">
      <nav class="tabbar" aria-label="Hauptbereiche">
        <button class="tab" type="button" data-action="page" data-page="heute" aria-current="page"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg><span class="tab-dot" hidden><span class="sr-only">Neu</span></span></span><span>Heute</span></button>
        <button class="tab" type="button" data-action="page" data-page="kalender"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path stroke="currentColor" stroke-width="1.7" d="M8 3.5v3M16 3.5v3M4 10h16"/></svg><span class="tab-dot" hidden><span class="sr-only">Neu</span></span></span><span>Kalender</span></button>
        <button class="tab" type="button" data-action="page" data-page="posts"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M5 6h14M5 12h14M5 18h9"/></svg><span class="tab-dot" hidden><span class="sr-only">Neu</span></span></span><span>Posts</span></button>
        <button class="tab" type="button" data-action="page" data-page="schwarm"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path stroke="currentColor" stroke-width="1.4" d="M9 10.2 10.6 14M15 10l-1.6 4"/></svg><span class="tab-dot" hidden><span class="sr-only">Neu</span></span></span><span>Schwarm</span></button>
        <button class="tab" type="button" data-action="page" data-page="analyse"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M8 4v16M5.8 8.5h4.4v7H5.8M16 3.5v17M13.8 9h4.4v6.5h-4.4"/></svg><span class="tab-dot" hidden><span class="sr-only">Neu</span></span></span><span>Analyse</span></button>
        <button class="tab" type="button" data-action="page" data-page="mehr"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="4" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="14" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="14" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span class="tab-dot" hidden><span class="sr-only">Neu</span></span></span><span>Mehr</span></button>
      </nav>
    </footer>
    </div>
    <div id="pull-ind" class="pull-ind" hidden>
      <span class="pull-chip" id="pull-chip">
        <svg class="pull-arrow" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 14l6-6 6 6"/></svg>
      </span>
    </div>
    <div id="detail-root"></div>
    <div id="egg-root"></div>
    <div id="ko-sheet" class="ko-sheet" hidden>
      <button type="button" class="ko-backdrop" data-action="close-ko" aria-label="Schließen"></button>
      <div class="ko-card" role="dialog" aria-modal="true" aria-labelledby="ko-title">
        <div class="ko-head row between">
          <h2 id="ko-title">Knock-out</h2>
          <button type="button" class="icon-btn" data-action="close-ko" aria-label="Schließen">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="ko-body">
          <p class="kicker">Basiswert</p>
          <div class="chips" id="ko-symbols"></div>
          <p class="ko-price" id="ko-price"></p>
          <p class="kicker">Typ</p>
          <div class="segment" id="ko-side">
            <button type="button" data-action="ko-side" data-side="long" aria-selected="true">Long</button>
            <button type="button" data-action="ko-side" data-side="short">Short</button>
          </div>
          <label class="ko-field" for="ko-barrier">Knock-out-Schwelle in $
            <input id="ko-barrier" inputmode="decimal" autocomplete="off" placeholder="136,2">
          </label>
          <div id="ko-out" class="ko-out" aria-live="polite"></div>
          <p class="ko-hint">Der Knock-out greift auch außerhalb der US-Börsenzeit.</p>
          <label class="ko-field" for="ko-ratio">Bezugsverhältnis
            <input id="ko-ratio" inputmode="decimal" autocomplete="off" placeholder="0,1">
          </label>
          <div class="ko-qty-head row between">
            <p class="kicker">Anzahl / Einsatz</p>
            <div class="segment ko-mode">
              <button type="button" data-action="ko-mode" data-mode="anzahl" aria-selected="true">Stück</button>
              <button type="button" data-action="ko-mode" data-mode="einsatz">€</button>
            </div>
          </div>
          <label class="ko-field" for="ko-qty"><span class="sr-only">Anzahl oder Einsatz</span>
            <input id="ko-qty" inputmode="decimal" autocomplete="off" placeholder="Stück">
          </label>
          <p class="ko-move" id="ko-move"></p>
          <p class="kicker">Gespeichert</p>
          <label class="ko-field" for="ko-name">Name
            <input id="ko-name" maxlength="40" autocomplete="off" placeholder="z. B. SPCX Long">
          </label>
          <button type="button" class="ko-save" data-action="save-ko">Merken</button>
          <div id="ko-saved"></div>
        </div>
      </div>
    </div>
    <div id="link-sheet" class="link-sheet" hidden>
      <div class="card">
        <h2>In Safari öffnen</h2>
        <p>Der Link bleibt außerhalb der App, damit du hier nicht hängen bleibst.</p>
        <p class="muted" id="link-sheet-url"></p>
        <div class="yesno">
          <button type="button" data-action="open-link-again">Nochmal öffnen</button>
          <button type="button" data-action="dismiss-link">Schließen</button>
        </div>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript><p>Justy GT-R braucht JavaScript. Bitte in Safari aktivieren.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
