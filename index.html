<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Justy GT-R: persönliches Recherche-Cockpit für SpaceX, Tesla und den Musk-Kosmos.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Justy GT-R">
  <title>Justy GT-R</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="icons/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="icons/splash-750x1334.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#pager">Zum Inhalt</a>
  <div class="app">
    <header class="topbar">
      <button id="logo-btn" class="logo-btn" type="button" aria-label="Justy GT-R">
        <img src="icons/logo.svg" width="40" height="40" alt="">
      </button>
      <div class="brand">
        <strong>Justy GT-R <span id="mode-pill" class="pill" hidden>Beispiel</span></strong>
        <span id="stand">Recherche</span>
      </div>
      <button class="icon-btn" type="button" data-action="refresh" aria-label="Daten aktualisieren">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M19 12a7 7 0 1 1-2-4.9M19 5v4h-4"/></svg>
      </button>
      <time id="clock"></time>
    </header>
    <div class="pager" id="pager">
      <section class="page" id="page-heute" aria-label="Startseite"><p class="empty">Cockpit wird geladen …</p></section>
      <section class="page" id="page-kalender" aria-label="Kalender"></section>
      <section class="page" id="page-posts" aria-label="Posts"></section>
      <section class="page" id="page-schwarm" aria-label="Schwarmwissen"></section>
      <section class="page" id="page-charts" aria-label="Charts"></section>
      <section class="page" id="page-mehr" aria-label="Mehr"></section>
    </div>
    <footer class="dock">
      <p class="disclaimer">Keine Anlageberatung</p>
      <nav class="tabbar" aria-label="Hauptbereiche">
        <button class="tab" type="button" data-action="page" data-page="heute" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg><span>Heute</span></button>
        <button class="tab" type="button" data-action="page" data-page="kalender"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path stroke="currentColor" stroke-width="1.7" d="M8 3.5v3M16 3.5v3M4 10h16"/></svg><span>Kalender</span></button>
        <button class="tab" type="button" data-action="page" data-page="posts"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M5 6h14M5 12h14M5 18h9"/></svg><span>Posts</span></button>
        <button class="tab" type="button" data-action="page" data-page="schwarm"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="16" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path stroke="currentColor" stroke-width="1.4" d="M9 10.2 10.6 14M15 10l-1.6 4"/></svg><span>Schwarm</span></button>
        <button class="tab" type="button" data-action="page" data-page="charts"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M4 16l4.5-5 3.2 3L20 6"/></svg><span>Charts</span></button>
        <button class="tab" type="button" data-action="page" data-page="mehr"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="4" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="14" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="14" width="6" height="6" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg><span>Mehr</span></button>
      </nav>
    </footer>
    <div id="detail-root"></div>
    <div id="egg-root"></div>
    <div id="link-sheet" class="link-sheet" hidden>
      <div class="card">
        <h2>In Safari öffnen</h2>
        <p>Der Link bleibt außerhalb der App, damit du hier nicht hängen bleibst.</p>
        <p class="muted" id="link-sheet-url"></p>
        <div class="yesno">
          <button type="button" data-action="open-link-again">Nochmal öffnen</button>
          <button type="button" data-action="dismiss-link">Schließen</button>
        </div>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript><p>Justy GT-R braucht JavaScript. Bitte in Safari aktivieren.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
